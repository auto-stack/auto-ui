[package]
name = "auto-ui-runtime"
version = "0.2.0"
edition = "2021"
description = "UI runtime: the VM rendering track / desktop host stack (iced renderer, desktop session/protocol, editor/terminal/media widgets, host adapters and provider implementations), extracted from auto-lang (PLAN-814)."
license = "MIT"
keywords = ["ui", "runtime", "renderer", "desktop"]

# PLAN-814 T-04：features/依赖自 auto-lang 随 ui/ 整体迁入（同名同语义）；
# 旧 auto-lang 侧同名 feature 转发本包。default 维持旧默认重后端形态
# （原 auto-lang default 含 ui-iced——"UI 部署 profile 仍保原功能而非删除
# 默认重后端"，§5.7）。
[features]
default = ["ui-iced"]
ui = ["auto-ui-compiler/ui"]
# PLAN-018（Design52 D）：稳定UI基线（解释器/image-pipeline/code-editor/
# 剪贴板/对话框/native-dock/clipboard + iced后端依赖）恒在——deps非optional、
# 代码cfg门删除；ui-interpreter/ui-clipboard等收敛为组合别名（不挂 dep:）。
ui-interpreter = ["ui"]
ui-headless = ["ui", "ui-interpreter", "auto-ui-compiler/ui-headless"]
image-pipeline = ["auto-media-core/image-codec"]
# PLAN-018：ui-iced 实现选择器退役——保留为兼容别名（仅转发基线子feature，
# 不挂任何 dep:、不被任何cfg消费），default 经它保持字面兼容（生成模板/
# 26 example required-features/Man 默认链零改）。
ui-iced = [
    "ui",
    "ui-interpreter",
    "image-pipeline",
    "code-editor",
    "ui-clipboard",
    "ui-dialog",
    "native-dock",
    "native-clipboard",
]
# code-editor 双 owner 语义保持：SDK 侧 a2r diff 双轨（auto-lang-core/
# code-editor）+ 本包 editor 注册表/provider（ui/code_editor）。
code-editor = ["ui", "auto-lang-core/code-editor"]
highlight-treesitter = [
    "code-editor",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    # P0 10 语言（T-02）
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-md",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    # P1 8 语言（T-04）
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-xml",
    # P2 3 语言（T-05；ini=Apache-2.0 许可注记见 auto-lang 依赖节）
    "dep:tree-sitter-batch",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-ini",
]
# PLAN-900：随迁的 http e2e 族（真 TCP 串行）——PLAN-018 T-03：Cargo feature
# 选择门退役，族常驻 test 编译可见；运行由 nextest default-filter 排除出日常、
# 显式 -E 过滤 + test-group 串行选择（见 .config/nextest.toml）。
ui-clipboard = []
ui-dialog = []
mpv-native = ["ui", "dep:libloading"]
mpv-gpu = ["mpv-native", "dep:iced_wgpu"]
mpv-widget = ["mpv-gpu", "ui-iced"]
mpv-spike = ["mpv-gpu", "ui-iced"]
# 跨仓 autodown-core（不进 SDK；解析序 env/组内/主检出——见 AGENTS）。
autodown = ["dep:autodown-core"]
native-dock = []
native-clipboard = []
native-dnd = ["dep:windows-core"]
# PLAN-029 T-02：doc-surface 实验文档表面（真实 VM 窗口内 wry WebView2 子
# 表面；probe-only，SD-02 记边界；非 windows 目标不开）。
doc-surface = ["dep:wry"]

[dependencies]
auto-web = { version = "=0.1.0", path = "../../../auto-web/crates/auto-web" }
auto-lang-core = { path = "../../../auto-lang/crates/auto-lang-core" }
# PLAN-900 T-03：UiCompatInstaller 进程期自注册（原 auto-lang facade 迁入）。
inventory = "0.3"
auto-ui-compiler = { path = "../auto-ui-compiler" }
# PLAN-841 T-05: runtime consumes the UI-owned domain model (UiCode/UiStmt)
auto-ui-dialect = { path = "../auto-ui-dialect" }
# PLAN-841 T-05: DomainStmt/DomainCode path for the domain-port walks
auto-parser-api = { path = "../../../auto-lang/crates/auto-parser-api" }
auto-val = { path = "../../../auto-lang/crates/auto-val", features = ["serde"] }
# PLAN-811: media foundation（image_pipeline/photo_service 门面语义随迁——
# blake3-only 服务恒在，codec 走 image-pipeline feature）。
auto-media-core = { path = "../../../auto-lang/crates/auto-media-core", default-features = false }
# PLAN-807: text foundation（code_editor/diff 门面消费）。
auto-text-core = { path = "../../../auto-lang/crates/auto-text-core" }
# PLAN-808: terminal host-domain core（TerminalHostProvider 端口）。
auto-terminal-core = { path = "../../../auto-lang/crates/auto-terminal-core" }
# a2r-std：frame_bench 帧时间戳通道同源（PLAN-716 组B 契约）。
a2r-std = { path = "../../../auto-lang/crates/a2r-std" }
# Plan 019 批次七: autodown-core（跨仓 path 指向 auto-down 主检出 crate）。
autodown-core = { path = "../../../auto-down/autodown/packages/engine/rust", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0.12"
regex = "1.11.1"
notify = "7.0"
tokio = { version = "1.49", features = ["full"] }
blake3 = "1.5"
chrono = "0.4"
lazy_static = "1.4"
futures = "0.3"
base64 = "0.22"
# PLAN-814 R9-03：syslog set_boxed_logger 需 log std（→alloc）——headless
# 形态无 iced 传递者时显式钉住（旧巨树经 ui-iced 默认链传递获得）。
log = { version = "0.4", features = ["std"] }
miette = { version = "7.2", features = ["fancy"] }
dirs = "6.0.0"
urlencoding = "2.1"
# Plan 299/699: MCP streamable HTTP 服务面（mcp_server——axum HTTP/1.1 传输）。
axum = { version = "0.8", features = ["json"] }
# Plan 350: WebSocket client（mcp/桌面协议同步桥，专用线程同步形态）。
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
# Plan 154/341: HTTP client（renderer 图片/SVG 拉取阻塞臂等）。
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "multipart", "cookies", "gzip", "brotli"] }

# ── iced 后端（Plan 015/041/414/459/617/683 门面注释随迁自 auto-lang） ──
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "advanced", "canvas", "unconditional-rendering"] }
iced_widget = { version = "0.14" }
iced_futures = { version = "0.14" }
iced_wgpu = { version = "0.14", optional = true }
libloading = { version = "0.8", optional = true }
iced_runtime = { version = "0.14" }
iced_tiny_skia = { version = "0.14" }
arboard = { version = "3" }
rfd = { version = "0.15" }
raw-window-handle = { version = "0.6" }
image = { version = "0.25" }
resvg = { version = "0.45" }
tiny-skia = { version = "0.11" }
kamadak-exif = { version = "0.6" }
cosmic-text = { version = "0.15", features = ["vi", "syntect"] }
syntect = { version = "5" }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
tree-sitter-batch = { version = "0.11", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-ini = { version = "1.4", optional = true }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Marshal",
    "implement",
] }
windows-core = { version = "0.58", optional = true }

# PLAN-029 T-02：doc-surface 实验文档表面——真实原生 VM 窗口内的 wry
# WebView2 子表面（026 native_host 同缝 build_as_child）。实验能力：cargo
# feature `doc-surface` 门控，缺省构建不含 wry；仅 windows 目标。
wry = { version = "=0.57.0", optional = true }

# PLAN-900 T-05：mpv 三集成测试随 auto-lang 迁入——必须保持集成目标形态
#（lib --test 目标触发 rustc ICE，PLAN-617 T-16债务 P617-D1 原注释随迁）；
# required-features 与 auto-lang 侧原声明逐位一致。
[[test]]
name = "mpv_engine"
path = "tests/mpv_engine.rs"
required-features = ["mpv-native"]

[[test]]
name = "mpv_channel"
path = "tests/mpv_channel.rs"
required-features = ["mpv-gpu"]

[[test]]
