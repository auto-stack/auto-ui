[dev-dependencies]
# PLAN-060: exercise the actual WGPU canvas geometry backend without a device.
iced_wgpu = "0.14"
# PLAN-018 T-03：iced_test 仅测试工具箱——自 optional+feature 门转 dev 依赖。
iced_test = { version = "0.14" }

# PLAN-900 T-05：ui_snapshots（insta 快照围栏）随 auto-lang 迁入。
insta = { version = "1", features = ["filters"] }
# PLAN-814 T-07：plan804_os_e2e（随 owner 迁入）的消费面。
fastrand = "2.4.1"
resvg = "0.45"
tiny-skia = "0.11"
tempfile = "3"
