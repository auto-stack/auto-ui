# PLAN-831 T-06：auto-ui 独立 workspace（承接语言仓 UI 包组；旧 AURA/GPUI
# legacy 已移除——历史分支与 784/T-02 保全快照在案）。
#
# 语言基础（auto-lang-core/auto-parser-api/auto-val/auto-atom/auto-media-core/
# auto-text-core/auto-terminal-core/a2r-std/auto-project-model/auto-tool-protocol/
# auto-tool-execution/auto-api-gen）与跨仓 optional autodown-core 以**组内兄弟
# 相对 path**（../../../auto-lang/crates/…、../../../auto-down/…）依赖——本仓
# 检出与 auto-lang（及启用 autodown feature 时的 auto-down）同级布局即可解析，
# registry 依赖由受管 Cargo.lock 锁定（fresh/locked 可复现；重定位 A→B 同布局
# 成立）。发布渠道/固定 rev 清单冻结归 T-07/T-09（SD-02/04）。
[workspace]
# PLAN-900：显式成员表（原 crates/* glob 因 auto-cosmic 父目录非包而不可用）；
# auto-cosmic 整族 + auto-lsp 自 auto-lang 迁入（T-02/T-06）。
members = [
    "crates/auto-ui-compiler",
    "crates/auto-ui-dialect",
    "crates/auto-ui-runtime",
    "crates/auto-ui-tools",
    "crates/shell-pack",
    "crates/auto-lsp",
    "crates/auto-cosmic/ports",
    "crates/auto-cosmic/ports-linux",
    "crates/auto-cosmic/demo",
    "crates/auto-cosmic/host-libcosmic",
    "crates/auto-cosmic/host-smithay",
]
resolver = "2"

# iced_widget 本地补丁随 UI 栈迁入本仓（自 auto-lang crates/patches 同源复制；
# P041-D1 竞态族根治，2026-09-25 实证）。PLAN-900 时 auto-lang 注明"auto-ui
# 侧由其自身 [patch] 接管（计划 D）"——本次补上（缺失窗口内 tool host 走
# crates.io 原版，container.rs:291 布局空窗 unwrap 曾致 VM 会话崩溃族，
# DATABASE-002 原生门消费者门实证复现）。补丁语义=布局空窗良性降级，
# 与上游 0.14.2 唯一差异面为 container.rs 五处；升级 iced 时按补丁 README
# 重审。
[patch.crates-io]
iced_widget = { path = "crates/patches/iced_widget" }
