[workspace]
exclude = [".sdk-source"]

[package]
name = "autographics-auto-driver"
default-run = "autographics-auto-driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "age-game-player"
path = "src/bin/age-game-player.rs"

[dependencies]
auto-lang-core = { path = ".sdk-source/crates/auto-lang-core" }
auto-val = { path = ".sdk-source/crates/auto-val" }

serde_json = "1"
serde = { version = "1", features = ["derive"] }
agp = { path = "../autographics-prototype" }
glam = "0.34"
gltf = { version = "1.4", features = ["extras"] }
winit = "0.30.13"
iced = "0.14.0"
iced_wgpu = "0.14.0"
kira = { version = "0.9", features = ["ogg"] }
cpal = "=0.15.3"
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "vorbis"] }


[profile.dev]
debug = 0


[dev-dependencies]
png = "0.18"
# PLAN-044 T-03：测试内构造 SDK span（MsgWithSource）；与 .sdk-source 锁定树
# 中既有 miette 7.6.0 同版（Cargo.lock 已含，不新增下载）。
miette = "7.6"
sha2 = "0.10"
