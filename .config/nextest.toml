# PLAN-831 F831-09-04：UI 仓 nextest 档配置（承接语言仓 .config/nextest.toml
# 中 UI 面的选择语义——五包 owner 迁入后原仓 default-filter 对本仓不再生效）。
#
# - ui_gen:: 排除日常档 t（fix-ui-tier 2026-09-30 语义随迁：代码生成测试族
#   每进程重付 WidgetRegistry 构建税（OnceLock 在 nextest 每测试一进程模型下
#   失效），归单进程 `cargo tu`（bare cargo test = 单进程 libtest，setup 全档
#   只付一次）；t 不再双覆盖 ui_gen）。
# - 本仓无登记的重内存测试（语言仓 .config/test-mem-weights.md 无 auto-ui 包
#   条目；heavy_gate 体内守门在本仓无用户）→ 无需 test-groups 资源队列。
#   机器级单实例闸门（画廊围栏/1M churn，D:/autostack/.locks/<family>.lock）
#   仍归语言仓 heavy 族所有，不随五包迁移。
# - slow-timeout 与语言仓同参（60s 警告 / 120s 终止）。
# - t 档仅 --lib 面；integration 目标（tools 四件 + runtime osconfig）归
#   `cargo ti` 档；native_dnd_e2e 为手工 native 门（`cargo tn`，双 feature
#   真光标交互，不进日常/集成档）——三者共同保证原选择面零丢失。
[profile.default]
# PLAN-018 T-03：三UI测试选择feature退役后，原feature隐藏族转为 nextest
# 静态边界——http e2e（真TCP串行）与 iced GPU/布局族（iced_test模拟器，
# 117+19条）常驻编译可见但不进日常档；显式运行经 -E 名过滤（串行经
# override 单线程，保持原条件）。零选择不PASS：显式过滤的枚举对账见
# plan-artifacts/plan-018/t03_*。
default-filter = "not test(ui_gen::) and not test(/http_e2e/) and not test(/^(ui::iced::(layout_tests|terminal_pixel_tests|p022_stack_click_tests|terminal_input_tests|pointer_placement_tests)|ui::terminal::iced::(p025_scroll_render_tests|widget::virtual_scroll_tests::(probe_publish_follows_available_width_and_stays_stable|shortcut_hit_captures_single_fire_across_stack)))/) and not test(/^ui::iced::selectable_text::tests::text_selection_simulator/) and not test(/^ui::iced::renderer::line_edit_tests::p(483|490|491)_/) and not test(/^ui::iced::renderer::plan080_uat_cjk_bubble_tests/) and not test(/^ui::native_dock::win32::(native_dock_events|native_dock_geometry)/)"

[profile.default.slow-timeout]
period = "60s"
terminate-after = 2

# PLAN-018 T-03：原 feature 门族的串行/资源条件保留——http e2e 真TCP与
# iced_test 模拟器族显式运行时单线程（原 libtest 单进程形态等价）。
[[profile.default.overrides]]
filter = 'test(/http_e2e/)'
threads-required = 1

[[profile.default.overrides]]
filter = 'test(/^(ui::iced::(layout_tests|terminal_pixel_tests|p022_stack_click_tests|terminal_input_tests|pointer_placement_tests)|ui::terminal::iced::(p025_scroll_render_tests|widget::virtual_scroll_tests::(probe_publish_follows_available_width_and_stays_stable|shortcut_hit_captures_single_fire_across_stack)))/) or test(/^ui::iced::selectable_text::tests::text_selection_simulator/) or test(/^ui::iced::renderer::line_edit_tests::p(483|490|491)_/) or test(/^ui::iced::renderer::plan080_uat_cjk_bubble_tests/) or test(/^ui::native_dock::win32::(native_dock_events|native_dock_geometry)/)'
threads-required = 1
